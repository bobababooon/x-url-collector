name: URL収集の定期実行

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 依存関係をインストール
        run: npm install

      - name: URL収集を実行
        run: node collector.js
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CSRF_TOKEN: ${{ secrets.X_CSRF_TOKEN }}

      - name: 収集結果を保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add urls.csv
          git diff --cached --quiet || git commit -m "URL収集結果を更新"
          git push
